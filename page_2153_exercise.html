<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
    	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title></title>
		
        <!-- FAVICON --><link rel="shortcut icon" href="../core/imgs/favicon.ico">
        
        <!-- CSS PLUG --><link rel="stylesheet" type="text/css" href="../core/css/ebook.css" />
        <!-- CSS PLUG --><link rel="stylesheet" type="text/css" href="../core/css/exercises.css" />

        <!-- JS PLUG --><script type="text/javascript" language="javascript" src="../core/js/config.js"></script>
        <!-- JS PLUG --><script type="text/javascript" language="javascript" src="../core/js/core.js"></script>
        <!-- JS PLUG --><script type="text/javascript" language="javascript" src="../core/js/exercises.js"></script>
		
        <script type="text/javascript" language="javascript">
			$(document).ready(function(){
				$("body").autoFormsDisplay(101);
				   $(".exercise").show(); 
				   $(".prnt").hide();
				   $(".navegacion_sco_link").hide();
				$('.prnt').show();
				
				//SETEANDO VALORES ORIGINALES DE FUENTE
				setOriginalSize( $('.central') );
				
				// OFFLINE-MODE
				if( String(window.location.href).indexOf("file:///")>=0 ){
					setTimeout(function(){
						try{
							if( window.parent ){
								window.parent.postMessage($(document).height()+"","*");
							}
						}catch(e){
							console.log(e);
						}
					}, 100);
				}
			});					   
		</script>
		
		<!-- JS PLUG --><script type="text/javascript" language="javascript" src="../core/js/iframe.js"></script>
		
		<style>
			.drag-and-drop{margin-left: 8px;}
			body{background: #E9F0FA;}
		</style>
    </head>
    <body> 
        <!-- EXERCISE -->
		<div class="central">
        	<div class="page">
			<div class="prnt" style="float:right;margin: 5px 15px 0 0;cursor: pointer;display: none;"><img class="print" src="../core/imgs/pearlescent/autoforms/ico_print.gif" alt="print" title="Imprimir ejercicio" /></div>
			<div id="instructions" style="padding: 15px 15px 0px 9px;"><div class="content"></div></div>
			<div class="workbook-relation" style="display: none;margin-left: 15px;"></div>
			<div class="clear-fix"></div>
			<div class="exercise" id="test" style="padding: 10px 10px 60px 10px;">
				<ul class="anchor-navigation"></ul>
				<div class="exercise-bar"></div>
				<div class="exercise-feedback"></div>
			</div>
            </div>
		</div>
        <!-- ENDING EXERCISE --> 
    </body>
</html>
